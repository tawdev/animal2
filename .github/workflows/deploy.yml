name: Deploy Animal Food Express

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Project directory
            mkdir -p /home/animal/animal2
            cd /home/animal/animal2

            # Clone or update repository
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/tawdev/animal2.git .
            else
              echo "Updating repository..."
              git fetch origin main
              git reset --hard origin/main
            fi

            ########################
            # Backend
            ########################
            cd /home/animal/animal2/backend/droguerie-backend

            npm install
            rm -rf dist
            npm run build

            pm2 delete animal-backend || true

            PORT=3021 pm2 start npm \
              --name animal-backend \
              --cwd /home/animal/animal2/backend/droguerie-backend \
              -- run start:prod

            ########################
            # Frontend
            ########################
            cd /home/animal/animal2

            npm install
            rm -rf .next
            npm run build

            pm2 delete animal-frontend || true

            pm2 start npm \
              --name animal-frontend \
              --cwd /home/animal/animal2 \
              -- run start

            # Save PM2
            pm2 save