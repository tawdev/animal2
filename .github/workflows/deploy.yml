name: Deploy Animal Food Express

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR=/home/animal/animal2

            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # Fix Git safe directory
            git config --global --add safe.directory $PROJECT_DIR

            # Clone or update repository
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/tawdev/animal2.git .
            else
              echo "Updating repository..."
              git fetch origin main
              git reset --hard origin/main
            fi

            ########################
            # Backend
            ########################
            cd $PROJECT_DIR/backend/droguerie-backend

            npm install
            rm -rf dist
            npm run build

            pm2 delete animal-backend || true

            PORT=3021 pm2 start npm \
              --name animal-backend \
              --cwd $PROJECT_DIR/backend/droguerie-backend \
              -- run start:prod

            ########################
            # Frontend
            ########################
            cd $PROJECT_DIR

            npm install
            rm -rf .next
            npm run build

            pm2 delete animal-frontend || true

            pm2 start npm \
              --name animal-frontend \
              --cwd $PROJECT_DIR \
              -- run start

            pm2 save